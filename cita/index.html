<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3A2E">
<meta name="robots" content="noindex">
<title>Agendar cita · Médica Country</title>
<style>
  /* Fondo verde oscuro tipo chat arriba, tarjeta blanca que sube desde abajo (como la ventanita de WhatsApp). */
  :root { --fondo:#0B3A2E; --fondo2:#0F4A3B; --tarjeta:#FFFFFF; --txt:#13201B; --sub:#5B6B64; --verde:#0B6B4F; --verde-claro:#E4F3EC; --linea:#E3EAE6; --gris:#C5CEC9; --rojo:#B3261E; --rojo-claro:#FCE8E6;
    --f: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--f); background: linear-gradient(180deg, var(--fondo), var(--fondo2)); color: var(--txt); -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid #7FD3B1; outline-offset: 2px; }
  .arriba { color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 18px) max(20px, env(safe-area-inset-right, 0px)) 22px max(20px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 12px; }
  .logo { width: 42px; height: 42px; border-radius: 12px; background: #fff; color: var(--fondo); display: grid; place-items: center; font-weight: 800; font-size: 14px; letter-spacing: .5px; flex-shrink: 0; }
  .arriba b { display: block; font-size: 17px; letter-spacing: .3px; }
  .arriba small { opacity: .8; font-size: 13px; }
  .hoja { background: var(--tarjeta); border-radius: 22px 22px 0 0; min-height: calc(100vh - 86px); min-height: calc(100dvh - 86px); max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; box-shadow: 0 -10px 30px rgba(0,0,0,.18); animation: sube .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes sube { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .hoja { animation: none; } }
  .asa { width: 40px; height: 5px; border-radius: 3px; background: var(--linea); margin: 10px auto 0; }
  .cab { display: flex; align-items: center; padding: 8px 12px 10px; border-bottom: 1px solid var(--linea); }
  .cab a, .cab button.x { width: 40px; height: 40px; border-radius: 50%; border: none; background: none; display: grid; place-items: center; color: #54656F; font-size: 22px; text-decoration: none; }
  .cab h1 { flex: 1; text-align: center; font-size: 17px; margin: 0 40px 0 0; }
  .cuerpo { flex: 1; padding: 18px max(18px, env(safe-area-inset-left, 0px)) 18px max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
  .hola { font-size: 20px; font-weight: 700; margin: 0; }
  .sub { color: var(--sub); margin: -8px 0 0; font-size: 15px; }
  .lugar { display: flex; gap: 10px; background: #F2F7F5; border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.35; }
  .lugar span { font-size: 18px; }
  .rotulo { font-size: 13px; color: var(--sub); font-weight: 600; letter-spacing: .3px; text-transform: uppercase; margin: 4px 0 -6px; }
  .cal { border: 1px solid var(--linea); border-radius: 14px; padding: 10px; }
  .cal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .cal-top b { font-size: 16px; text-transform: capitalize; }
  .cal-top button { width: 36px; height: 36px; border: none; border-radius: 50%; background: #F0F3F2; font-size: 18px; color: #2E3D37; }
  .cal-top button:disabled { opacity: .3; cursor: default; }
  .dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .dn { font-size: 12px; color: var(--sub); padding: 2px 0 4px; }
  .dia { aspect-ratio: 1; max-height: 46px; border: none; border-radius: 50%; background: none; font-size: 16px; color: var(--txt); font-variant-numeric: tabular-nums; }
  .dia.libre { font-weight: 600; }
  .dia.libre:hover { background: var(--verde-claro); }
  .dia:disabled { color: var(--gris); cursor: default; }
  .dia.vacio { visibility: hidden; }
  .dia.sel { background: var(--verde); color: #fff; }
  .nota { font-size: 13px; color: var(--sub); }
  .horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .hora { border: 1.5px solid var(--linea); background: #fff; border-radius: 12px; padding: 12px 6px; font-size: 15px; font-weight: 600; color: var(--txt); font-variant-numeric: tabular-nums; }
  .hora:hover { border-color: var(--verde); }
  .hora.sel { background: var(--verde); border-color: var(--verde); color: #fff; }
  .pie { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--linea); padding: 12px max(18px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(18px, env(safe-area-inset-right, 0px)); }
  .boton { width: 100%; border: none; border-radius: 26px; padding: 15px; font-size: 17px; font-weight: 700; background: var(--verde); color: #fff; }
  .boton:disabled { background: #D6DEDA; color: #6F7F78; cursor: default; }
  .boton.sec { background: #fff; color: var(--verde); border: 1.5px solid var(--verde); margin-top: 10px; }
  .pie small { display: block; text-align: center; color: var(--sub); font-size: 12px; margin-top: 8px; }
  .resumen { text-align: center; padding: 14px 0 4px; }
  .circulo { width: 72px; height: 72px; border-radius: 50%; background: var(--verde-claro); display: grid; place-items: center; margin: 0 auto 14px; font-size: 32px; color: var(--verde); font-weight: 800; }
  .circulo.mal { background: var(--rojo-claro); color: var(--rojo); }
  .resumen h2 { font-size: 22px; margin: 0 0 6px; }
  .resumen p { color: #3B4A44; margin: 4px 0; font-size: 16px; }
  .fila { display: flex; gap: 12px; border-top: 1px solid var(--linea); padding: 14px 2px; font-size: 15px; line-height: 1.35; }
  .fila span { width: 22px; text-align: center; }
  .aviso { background: var(--rojo-claro); color: var(--rojo); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .cargando { display: flex; gap: 7px; justify-content: center; padding: 60px 0; }
  .cargando i { width: 9px; height: 9px; border-radius: 50%; background: var(--verde); animation: brinca 1s infinite; }
  .cargando i:nth-child(2) { animation-delay: .15s; } .cargando i:nth-child(3) { animation-delay: .3s; }
  @keyframes brinca { 50% { transform: translateY(-7px); opacity: .5; } }
  a.boton { display: block; text-align: center; text-decoration: none; }
</style>
</head>
<body>
<header class="arriba"><div class="logo">MC</div><div><b>MÉDICA COUNTRY</b><small>Alto Espacio Hábitat</small></div></header>
<main class="hoja" aria-live="polite">
  <div class="asa"></div>
  <div class="cab"><a href="https://wa.me/525612422195" aria-label="Cerrar y volver a WhatsApp">✕</a><h1 id="titulo">Agendar cita</h1></div>
  <div class="cuerpo" id="cuerpo"><div class="cargando"><i></i><i></i><i></i></div></div>
  <div class="pie" id="pie" hidden></div>
</main>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbwW0w87bI-1Q7JDD-YK_NIXlgeypNOVd6m_nb1QOENaZOapB-GHPfpmc-YQr5j-oj_C/exec';
  var WA = 'https://wa.me/525612422195';
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var token = new URLSearchParams(location.search).get('t') || '';
  var E = { datos: null, mes: null, fecha: null, hora: null, aviso: '' };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function partes(clave) { var a = clave.split('-'); return { y: +a[0], m: +a[1], d: +a[2] }; }
  function fechaLarga(clave) { var p = partes(clave), f = new Date(p.y, p.m - 1, p.d); var t = DIAS[f.getDay()] + ' ' + p.d + ' de ' + MESES[p.m - 1]; return t.charAt(0).toUpperCase() + t.slice(1); }
  function horaTexto(id) { var lista = (E.datos.libres[E.fecha] || []); for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i].title; return id; }
  function api(cita) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ cita: cita }) })
      .then(function (r) { return r.json(); }, function () { throw new Error('Sin conexión. Revise su internet e intente de nuevo.'); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || j.mensaje || 'Algo salió mal.'); return j.data; });
  }
  function cargando() { $('cuerpo').innerHTML = '<div class="cargando"><i></i><i></i><i></i></div>'; $('pie').hidden = true; }
  function error(msg) {
    $('titulo').textContent = 'Agendar cita';
    $('cuerpo').innerHTML = '<div class="resumen"><div class="circulo mal">!</div><h2>No pudimos abrir su agenda</h2><p>' + esc(msg) + '</p></div>';
    $('pie').hidden = false; $('pie').innerHTML = '<a class="boton" href="' + WA + '">Volver a WhatsApp</a>';
  }

  function pantallaElegir() {
    var d = E.datos;
    $('titulo').textContent = 'Agendar cita';
    var min = partes(d.min_fecha), max = partes(d.max_fecha);
    if (!E.mes) { var primero = Object.keys(d.libres).sort()[0]; var p0 = primero ? partes(primero) : min; E.mes = { y: p0.y, m: p0.m }; }
    var y = E.mes.y, m = E.mes.m, primeroDia = new Date(y, m - 1, 1).getDay(), total = new Date(y, m, 0).getDate();
    var celdas = ['D','L','M','M','J','V','S'].map(function (x) { return '<span class="dn">' + x + '</span>'; }).join('');
    for (var i = 0; i < primeroDia; i++) celdas += '<button class="dia vacio" disabled tabindex="-1"></button>';
    for (var k = 1; k <= total; k++) {
      var clave = y + '-' + (m < 10 ? '0' : '') + m + '-' + (k < 10 ? '0' : '') + k, libre = !!d.libres[clave];
      celdas += '<button class="dia' + (libre ? ' libre' : '') + (E.fecha === clave ? ' sel' : '') + '" data-d="' + clave + '"' + (libre ? '' : ' disabled') + ' aria-label="' + esc(fechaLarga(clave)) + (libre ? '' : ', sin horarios') + '">' + k + '</button>';
    }
    var puedeAntes = (y > min.y) || (y === min.y && m > min.m), puedeDespues = (y < max.y) || (y === max.y && m < max.m);
    var horas = E.fecha ? (d.libres[E.fecha] || []) : [];
    $('cuerpo').innerHTML =
      (d.saludo ? '<p class="hola">Hola ' + esc(d.saludo) + ' 👋</p>' : '') +
      '<p class="sub">Elija el día y la hora que mejor le acomoden para conocer Médica Country.</p>' +
      '<div class="lugar"><span>📍</span><div><b>' + esc(d.lugar) + '</b><br>' + esc(d.direccion) + '</div></div>' +
      (E.aviso ? '<div class="aviso">' + esc(E.aviso) + '</div>' : '') +
      '<div class="rotulo">Día</div>' +
      '<div class="cal"><div class="cal-top"><button id="antes" aria-label="Mes anterior"' + (puedeAntes ? '' : ' disabled') + '>‹</button><b>' + MESES[m - 1] + ' ' + y + '</b><button id="despues" aria-label="Mes siguiente"' + (puedeDespues ? '' : ' disabled') + '>›</button></div><div class="dias">' + celdas + '</div></div>' +
      '<div class="nota">Los días en gris no tienen horarios libres.</div>' +
      (E.fecha ? '<div class="rotulo">Hora · ' + esc(fechaLarga(E.fecha)) + '</div>' +
        (horas.length ? '<div class="horas">' + horas.map(function (h) { return '<button class="hora' + (E.hora === h.id ? ' sel' : '') + '" data-h="' + esc(h.id) + '">' + esc(h.title) + '</button>'; }).join('') + '</div><div class="nota">Cada cita dura ' + (d.duracion || 60) + ' minutos.</div>'
          : '<div class="nota">Ese día ya no hay horarios. Elija otro, por favor.</div>') : '');
    $('pie').hidden = false;
    $('pie').innerHTML = '<button class="boton" id="seguir"' + (E.fecha && E.hora ? '' : ' disabled') + '>' + (E.fecha && E.hora ? 'Continuar' : E.fecha ? 'Elija una hora' : 'Elija un día') + '</button><small>Sus datos solo se usan para agendar su cita.</small>';
    [].forEach.call(document.querySelectorAll('[data-d]'), function (b) { b.onclick = function () { E.fecha = b.getAttribute('data-d'); E.hora = null; E.aviso = ''; pantallaElegir(); var h = document.querySelector('.horas'); if (h) h.scrollIntoView({ behavior: 'smooth', block: 'center' }); }; });
    [].forEach.call(document.querySelectorAll('[data-h]'), function (b) { b.onclick = function () { E.hora = b.getAttribute('data-h'); pantallaElegir(); }; });
    $('antes').onclick = function () { E.mes = m === 1 ? { y: y - 1, m: 12 } : { y: y, m: m - 1 }; pantallaElegir(); };
    $('despues').onclick = function () { E.mes = m === 12 ? { y: y + 1, m: 1 } : { y: y, m: m + 1 }; pantallaElegir(); };
    $('seguir').onclick = pantallaConfirmar;
  }

  function pantallaConfirmar() {
    var d = E.datos;
    $('titulo').textContent = 'Confirmar cita';
    $('cuerpo').innerHTML = '<div class="resumen"><div class="circulo">📅</div><h2>' + esc(fechaLarga(E.fecha)) + '</h2><p><b>' + esc(horaTexto(E.hora)) + '</b> · ' + (d.duracion || 60) + ' minutos</p></div>' +
      '<div class="fila"><span>📍</span><div><b>' + esc(d.lugar) + '</b><br>' + esc(d.direccion) + '</div></div>' +
      '<div class="fila"><span>👤</span><div>Con un asesor de Alto Espacio Hábitat</div></div>';
    $('pie').innerHTML = '<button class="boton" id="confirmar">Confirmar cita</button><button class="boton sec" id="cambiar">Cambiar día u hora</button>';
    $('cambiar').onclick = pantallaElegir;
    $('confirmar').onclick = function () {
      var b = $('confirmar'); b.disabled = true; b.textContent = 'Apartando su lugar…'; $('cambiar').hidden = true;
      api({ t: token, accion: 'agendar', fecha: E.fecha, hora: E.hora }).then(function (r) {
        if (r.ok) return pantallaListo(r.resumen);
        E.datos.libres = r.libres || E.datos.libres; E.hora = null;
        E.aviso = (r.datos && r.datos.aviso) || 'Ese horario se acaba de ocupar. Elija otro, por favor.';
        pantallaElegir();
      }).catch(function (e) { b.disabled = false; b.textContent = 'Confirmar cita'; $('cambiar').hidden = false; alertaSuave(e.message); });
    };
  }
  function alertaSuave(msg) {
    var a = document.createElement('div'); a.className = 'aviso'; a.textContent = msg;
    $('cuerpo').insertBefore(a, $('cuerpo').firstChild);
  }
  function pantallaListo(resumen) {
    var d = E.datos;
    $('titulo').textContent = 'Cita agendada';
    $('cuerpo').innerHTML = '<div class="resumen"><div class="circulo">✓</div><h2>¡Listo' + (d.saludo ? ', ' + esc(d.saludo) : '') + '!</h2><p>Su cita quedó el <b>' + esc(resumen) + '</b>' + (/\.$/.test(resumen) ? '' : '.') + '</p><p>' + esc(d.lugar) + '<br>' + esc(d.direccion) + '</p><p class="nota" style="margin-top:12px">También le mandamos la confirmación por WhatsApp.</p></div>';
    $('pie').innerHTML = '<a class="boton" href="' + WA + '">Volver a WhatsApp</a>';
  }

  if (!token) return error('Este link está incompleto. Pídanos uno nuevo por WhatsApp.');
  api({ t: token, accion: 'inicio' }).then(function (d) { E.datos = d; pantallaElegir(); }).catch(function (e) { error(e.message); });
})();
</script>
</body>
</html>
