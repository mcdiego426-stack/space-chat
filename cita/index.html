<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<title>Agendar visita · Médica Country</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Mismo lenguaje que altoespaciohabitat.github.io: gris cálido, tinta casi negra, Montserrat ligera, líneas finas, esquinas rectas. */
  :root { --fondo:#E8E7E3; --papel:#F3F2EF; --tinta:#111110; --sub:#5E5D58; --tenue:#8D8B84; --linea:#CFCDC6; --linea2:#DEDCD6; --rojo:#9A2A1F;
    --f: Montserrat, "Helvetica Neue", Arial, system-ui, sans-serif; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--f); background: var(--fondo); color: var(--tinta); -webkit-font-smoothing: antialiased; font-weight: 400; }
  button { font: inherit; cursor: pointer; color: inherit; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--tinta); outline-offset: 3px; }

  .barra { position: sticky; top: 0; z-index: 5; background: var(--fondo); border-bottom: 1px solid var(--linea); padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); }
  .barra-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--tinta); }
  .marca svg { width: 40px; height: 23px; }
  .marca svg path { stroke: var(--tinta); fill: none; stroke-width: 7; }
  .marca svg rect { fill: var(--tinta); }
  .marca b { display: block; font-weight: 400; font-size: 14px; letter-spacing: .32em; line-height: 1; }
  .marca small { display: block; font-size: 8px; letter-spacing: .5em; margin-top: 4px; text-align: center; color: var(--sub); }
  .cerrar { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--tinta); text-decoration: none; border: 1px solid var(--tinta); border-radius: 4px; padding: 9px 12px; white-space: nowrap; }

  main { max-width: 560px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  .ceja { font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--sub); margin: 0 0 14px; }
  h1 { font-weight: 300; font-size: clamp(30px, 8.5vw, 42px); line-height: 1.08; letter-spacing: -.01em; margin: 0 0 12px; text-wrap: balance; }
  .intro { font-size: 15px; line-height: 1.6; color: #2F2E2B; margin: 0 0 24px; }

  .caja { border: 1px solid var(--linea); background: var(--papel); padding: 18px; margin-bottom: 14px; }
  .caja .ceja { margin-bottom: 8px; }
  .lugar-nom { font-weight: 300; font-size: 22px; margin: 0 0 6px; }
  .lugar-dir { font-size: 14px; line-height: 1.55; color: var(--sub); margin: 0 0 12px; }
  .enlace { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--tinta); text-decoration: none; border-bottom: 1px solid var(--tinta); padding-bottom: 3px; }

  .opciones { display: grid; gap: 8px; }
  .opcion { display: block; width: 100%; text-align: left; border: 1px solid var(--linea); background: #fff; border-radius: 4px; padding: 14px 16px; }
  .opcion b { display: block; font-weight: 500; font-size: 15px; margin-bottom: 3px; }
  .opcion small { display: block; font-size: 12px; color: var(--sub); line-height: 1.45; }
  .opcion:hover { border-color: var(--tinta); }
  .opcion.sel { background: var(--tinta); border-color: var(--tinta); color: #F5F5F3; }
  .opcion.sel small { color: #C9C7C0; }
  .paso { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; }
  .paso i { font-style: normal; font-size: 11px; letter-spacing: .2em; color: var(--tenue); }
  .paso span { font-size: 11px; letter-spacing: .26em; text-transform: uppercase; }
  .paso em { font-style: normal; margin-left: auto; font-size: 12px; color: var(--sub); text-transform: none; letter-spacing: 0; }

  .cal { border: 1px solid var(--linea); background: var(--papel); padding: 14px 12px 12px; }
  .cal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cal-top b { font-weight: 400; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; }
  .cal-top button { width: 38px; height: 38px; border: 1px solid var(--linea); border-radius: 4px; background: none; font-size: 16px; }
  .cal-top button:disabled { opacity: .3; cursor: default; }
  .dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .dn { font-size: 10px; letter-spacing: .14em; color: var(--tenue); padding: 2px 0 6px; }
  .dia { aspect-ratio: 1; max-height: 48px; border: 1px solid transparent; border-radius: 4px; background: none; font-size: 15px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .dia.libre { border-color: var(--linea); background: #fff; font-weight: 500; }
  .dia.libre:hover { border-color: var(--tinta); }
  .dia:disabled { color: #B9B7B0; cursor: default; }
  .dia.vacio { visibility: hidden; }
  .dia.sel { background: var(--tinta); border-color: var(--tinta); color: #F5F5F3; }
  .nota { font-size: 12px; color: var(--sub); margin-top: 10px; line-height: 1.5; }

  .grupo { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--tenue); margin: 4px 0 8px; }
  .horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .hora { border: 1px solid var(--linea); background: #fff; border-radius: 4px; padding: 13px 6px; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .hora:hover { border-color: var(--tinta); }
  .hora.sel { background: var(--tinta); border-color: var(--tinta); color: #F5F5F3; }

  .pie { position: sticky; bottom: 0; background: var(--fondo); border-top: 1px solid var(--linea); margin-top: 28px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px)); }
  .pie-in { max-width: 560px; margin: 0 auto; }
  .elegido { font-size: 13px; color: var(--sub); text-align: center; margin: 0 0 10px; min-height: 1em; }
  .elegido b { color: var(--tinta); font-weight: 500; }
  .boton { display: block; width: 100%; border: 1px solid var(--tinta); border-radius: 4px; padding: 17px 14px; font-size: 12px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; background: var(--tinta); color: #F5F5F3; text-align: center; text-decoration: none; }
  .boton:disabled { background: transparent; color: var(--tenue); border-color: var(--linea); cursor: default; }
  .boton.sec { background: transparent; color: var(--tinta); margin-top: 10px; }
  .legal { display: block; text-align: center; color: var(--tenue); font-size: 11px; margin-top: 10px; }
  .legal a { color: var(--sub); }

  .resumen { text-align: center; padding: 8px 0 6px; }
  .sello { width: 64px; height: 64px; border: 1px solid var(--tinta); border-radius: 50%; display: grid; place-items: center; margin: 0 auto 18px; }
  .sello svg { width: 26px; height: 26px; stroke: var(--tinta); fill: none; stroke-width: 1.5; }
  .sello.mal { border-color: var(--rojo); } .sello.mal svg { stroke: var(--rojo); }
  .resumen h1 { margin-bottom: 8px; }
  .resumen p { color: #2F2E2B; font-size: 15px; line-height: 1.6; margin: 4px 0; }
  .fila { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--linea); padding: 14px 0; font-size: 14px; line-height: 1.5; }
  .fila:last-child { border-bottom: 1px solid var(--linea); }
  .fila span { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--tenue); padding-top: 3px; flex-shrink: 0; }
  .fila div { text-align: right; }
  .aviso { border: 1px solid var(--rojo); color: var(--rojo); padding: 12px 14px; font-size: 13px; line-height: 1.5; margin-bottom: 14px; background: #F7EFEC; }

  .cargando { display: flex; gap: 8px; justify-content: center; padding: 90px 0; }
  .cargando i { width: 6px; height: 6px; background: var(--tinta); animation: late 1.1s infinite; }
  .cargando i:nth-child(2) { animation-delay: .15s; } .cargando i:nth-child(3) { animation-delay: .3s; }
  @keyframes late { 50% { opacity: .2; } }
  .entra { animation: entra .4s cubic-bezier(.2,.8,.2,1); }
  @keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .entra, .cargando i { animation: none; } }
</style>
</head>
<body>
<header class="barra"><div class="barra-in">
  <a class="marca" href="https://altoespaciohabitat.github.io/" aria-label="Alto Espacio Hábitat">
    <svg viewBox="0 0 260 145" aria-hidden="true"><path d="M95 6 L6 140"/><path d="M95 6 L176 140"/><rect x="160" y="2" width="95" height="7"/><rect x="162" y="69" width="93" height="7"/><rect x="196" y="135" width="59" height="7"/></svg>
    <span><b>ALTO ESPACIO</b><small>HÁBITAT</small></span>
  </a>
  <a class="cerrar" href="https://wa.me/525612422195">WhatsApp</a>
</div></header>
<main id="cuerpo" aria-live="polite"><div class="cargando"><i></i><i></i><i></i></div></main>
<div class="pie" id="pie" hidden><div class="pie-in" id="pieIn"></div></div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbwW0w87bI-1Q7JDD-YK_NIXlgeypNOVd6m_nb1QOENaZOapB-GHPfpmc-YQr5j-oj_C/exec';
  var WA = 'https://wa.me/525612422195';
  // Los mismos lugares (mismos id) están en el cerebro: LUGARES_CITA.
  var LUGARES = [
    { id: 'inverti', nombre: 'Oficinas Inverti', dir: 'Av. Universidad 1011, int. 504, Zapopan, Jal.', mapa: 'https://maps.app.goo.gl/Pmu4d16nVfQwN7EV9' },
    { id: 'acueducto', nombre: 'Torre Médica Acueducto', dir: 'Anillo Periférico Nte. Manuel Gómez Morín 731, Puerta de Hierro, Zapopan, Jal.', mapa: 'https://maps.app.goo.gl/ABgg3jogXT39pPi18' },
    { id: 'video', nombre: 'Videollamada', dir: 'Por Google Meet. Le mandamos el link por WhatsApp.', video: true }
  ];
  function lugarPorId(id) { for (var i = 0; i < LUGARES.length; i++) if (LUGARES[i].id === id) return LUGARES[i]; return null; }
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var token = new URLSearchParams(location.search).get('t') || '';
  var E = { datos: null, mes: null, lugar: null, fecha: null, hora: null, aviso: '' };
  var $ = function (id) { return document.getElementById(id); };
  var ICO_OK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var ICO_MAL = '<svg viewBox="0 0 24 24"><path d="M12 6v8M12 17.5v.5"/></svg>';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function partes(clave) { var a = clave.split('-'); return { y: +a[0], m: +a[1], d: +a[2] }; }
  function fechaLarga(clave) { var p = partes(clave), f = new Date(p.y, p.m - 1, p.d); var t = DIAS[f.getDay()] + ' ' + p.d + ' de ' + MESES[p.m - 1]; return t.charAt(0).toUpperCase() + t.slice(1); }
  function horaTexto(id) { var lista = (E.datos.libres[E.fecha] || []); for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i].title; return id; }
  function hora24(h) { var m = String(h.id || h.title).match(/(\d{1,2}):(\d{2})/); if (!m) return 12; var n = +m[1]; if (/p\.?\s?m/i.test(h.title) && n < 12) n += 12; return n; }
  function api(cita) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ cita: cita }) })
      .then(function (r) { return r.json(); }, function () { throw new Error('Sin conexión. Revise su internet e intente de nuevo.'); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || j.mensaje || 'Algo salió mal.'); return j.data; });
  }
  function pie(html) { $('pie').hidden = !html; $('pieIn').innerHTML = html || ''; }
  function cuerpo(html) { $('cuerpo').innerHTML = '<div class="entra">' + html + '</div>'; }
  function lugarCaja(l, meet) {
    var liga = l.video ? (meet ? '<a class="enlace" href="' + esc(meet) + '" target="_blank" rel="noopener">Entrar a la videollamada ↗</a>' : '')
      : '<a class="enlace" href="' + l.mapa + '" target="_blank" rel="noopener">Cómo llegar ↗</a>';
    return '<div class="caja"><p class="ceja">' + (l.video ? 'Videollamada' : 'Ubicación') + '</p><p class="lugar-nom">' + esc(l.nombre) + '</p><p class="lugar-dir">' + esc(l.dir) + '</p>' + liga + '</div>';
  }
  function opcionesLugar() {
    return '<div class="opciones">' + LUGARES.map(function (l) {
      return '<button class="opcion' + (E.lugar === l.id ? ' sel' : '') + '" data-l="' + l.id + '" aria-pressed="' + (E.lugar === l.id) + '"><b>' + esc(l.nombre) + '</b><small>' + esc(l.video ? 'Google Meet, desde su celular o computadora' : l.dir) + '</small></button>';
    }).join('') + '</div>';
  }
  function error(msg) {
    cuerpo('<div class="resumen"><div class="sello mal">' + ICO_MAL + '</div><p class="ceja">Agendar visita</p><h1>No pudimos abrir su agenda.</h1><p>' + esc(msg) + '</p></div>');
    pie('<a class="boton" href="' + WA + '">Volver a WhatsApp</a>');
  }

  function pantallaElegir() {
    var d = E.datos;
    var min = partes(d.min_fecha), max = partes(d.max_fecha);
    if (!E.mes) { var primero = Object.keys(d.libres).sort()[0]; var p0 = primero ? partes(primero) : min; E.mes = { y: p0.y, m: p0.m }; }
    var y = E.mes.y, m = E.mes.m, primeroDia = new Date(y, m - 1, 1).getDay(), total = new Date(y, m, 0).getDate();
    var celdas = ['D','L','M','M','J','V','S'].map(function (x) { return '<span class="dn">' + x + '</span>'; }).join('');
    // En el mes actual se ocultan las semanas que ya pasaron completas (menos filas grises).
    var desde = 1;
    if (y === min.y && m === min.m) { var semanasPasadas = Math.floor((primeroDia + min.d - 1) / 7); if (semanasPasadas > 0) { desde = semanasPasadas * 7 - primeroDia + 1; primeroDia = 0; } }
    for (var i = 0; i < primeroDia; i++) celdas += '<button class="dia vacio" disabled tabindex="-1"></button>';
    for (var k = desde; k <= total; k++) {
      var clave = y + '-' + (m < 10 ? '0' : '') + m + '-' + (k < 10 ? '0' : '') + k, libre = !!d.libres[clave];
      celdas += '<button class="dia' + (libre ? ' libre' : '') + (E.fecha === clave ? ' sel' : '') + '" data-d="' + clave + '"' + (libre ? '' : ' disabled') + ' aria-label="' + esc(fechaLarga(clave)) + (libre ? '' : ', sin horarios') + '">' + k + '</button>';
    }
    var puedeAntes = (y > min.y) || (y === min.y && m > min.m), puedeDespues = (y < max.y) || (y === max.y && m < max.m);
    var horas = E.fecha ? (d.libres[E.fecha] || []) : [];
    var manana = horas.filter(function (h) { return hora24(h) < 13; }), tarde = horas.filter(function (h) { return hora24(h) >= 13; });
    function chips(lista) { return '<div class="horas">' + lista.map(function (h) { return '<button class="hora' + (E.hora === h.id ? ' sel' : '') + '" data-h="' + esc(h.id) + '">' + esc(h.title) + '</button>'; }).join('') + '</div>'; }
    var bloqueHoras = '';
    if (E.fecha) {
      bloqueHoras = '<div class="paso" id="pasoHora"><i>03</i><span>Hora</span><em>' + esc(fechaLarga(E.fecha)) + '</em></div>' +
        (horas.length
          ? (manana.length ? '<p class="grupo">Mañana</p>' + chips(manana) : '') + (tarde.length ? '<p class="grupo">Tarde</p>' + chips(tarde) : '') +
            '<p class="nota">La visita dura ' + (d.duracion || 60) + ' minutos, aproximadamente.</p>'
          : '<p class="nota">Ese día ya no hay horarios. Elija otro, por favor.</p>');
    }
    cuerpo(
      '<p class="ceja">Médica Country · Visita</p>' +
      '<h1>' + (d.saludo ? esc(d.saludo) + ', agende' : 'Agende') + ' su visita.</h1>' +
      '<p class="intro">Elija dónde, qué día y a qué hora. Un asesor de Alto Espacio le mostrará los consultorios en persona o por videollamada.</p>' +
      (E.aviso ? '<div class="aviso">' + esc(E.aviso) + '</div>' : '') +
      '<div class="paso"><i>01</i><span>Lugar</span></div>' + opcionesLugar() +
      '<div class="paso"><i>02</i><span>Día</span></div>' +
      '<div class="cal"><div class="cal-top"><button id="antes" aria-label="Mes anterior"' + (puedeAntes ? '' : ' disabled') + '>‹</button><b>' + MESES[m - 1] + ' ' + y + '</b><button id="despues" aria-label="Mes siguiente"' + (puedeDespues ? '' : ' disabled') + '>›</button></div><div class="dias">' + celdas + '</div>' +
      '<p class="nota">Los días con recuadro tienen horarios libres.</p></div>' +
      bloqueHoras
    );
    var listo = E.lugar && E.fecha && E.hora, lg = lugarPorId(E.lugar);
    pie('<p class="elegido">' + (listo ? '<b>' + esc(fechaLarga(E.fecha)) + '</b> · ' + esc(horaTexto(E.hora)) + ' · ' + esc(lg.nombre) : !E.lugar ? 'Elija dónde quiere su visita' : E.fecha ? 'Ahora elija una hora' : 'Elija un día para ver los horarios') + '</p>' +
      '<button class="boton" id="seguir"' + (listo ? '' : ' disabled') + '>Continuar</button>' +
      '<small class="legal">Sus datos solo se usan para agendar su visita · <a href="https://mcdiego426-stack.github.io/space-chat/privacidad.html" target="_blank" rel="noopener">Aviso de privacidad</a></small>');
    [].forEach.call(document.querySelectorAll('[data-l]'), function (b) { b.onclick = function () { E.lugar = b.getAttribute('data-l'); var y0 = window.scrollY; pantallaElegir(); window.scrollTo(0, y0); }; });
    [].forEach.call(document.querySelectorAll('[data-d]'), function (b) { b.onclick = function () { E.fecha = b.getAttribute('data-d'); E.hora = null; E.aviso = ''; pantallaElegir(); var h = $('pasoHora'); if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; });
    [].forEach.call(document.querySelectorAll('[data-h]'), function (b) { b.onclick = function () { E.hora = b.getAttribute('data-h'); var y0 = window.scrollY; pantallaElegir(); window.scrollTo(0, y0); }; });
    $('antes').onclick = function () { E.mes = m === 1 ? { y: y - 1, m: 12 } : { y: y, m: m - 1 }; pantallaElegir(); };
    $('despues').onclick = function () { E.mes = m === 12 ? { y: y + 1, m: 1 } : { y: y, m: m + 1 }; pantallaElegir(); };
    $('seguir').onclick = pantallaConfirmar;
  }

  function pantallaConfirmar() {
    var d = E.datos;
    window.scrollTo(0, 0);
    cuerpo('<p class="ceja">Confirmar visita</p><h1>' + esc(fechaLarga(E.fecha)) + '<br>' + esc(horaTexto(E.hora)) + '</h1>' +
      '<p class="intro">Revise los datos y confirme. Le apartamos el horario de inmediato.</p>' +
      '<div class="fila"><span>' + (lugarPorId(E.lugar).video ? 'Modalidad' : 'Lugar') + '</span><div>' + esc(lugarPorId(E.lugar).nombre) + '<br><small style="color:var(--sub)">' + esc(lugarPorId(E.lugar).dir) + '</small></div></div>' +
      '<div class="fila"><span>Duración</span><div>' + (d.duracion || 60) + ' minutos</div></div>' +
      '<div class="fila"><span>Le atiende</span><div>Un asesor de Alto Espacio Hábitat</div></div>');
    pie('<button class="boton" id="confirmar">Confirmar visita</button><button class="boton sec" id="cambiar">Cambiar día u hora</button>');
    $('cambiar').onclick = function () { pantallaElegir(); window.scrollTo(0, 0); };
    $('confirmar').onclick = function () {
      var b = $('confirmar'); b.disabled = true; b.textContent = 'Apartando su horario…'; $('cambiar').hidden = true;
      api({ t: token, accion: 'agendar', lugar: E.lugar, fecha: E.fecha, hora: E.hora }).then(function (r) {
        if (r.ok) return pantallaListo(r.resumen, r.meet);
        E.datos.libres = r.libres || E.datos.libres; E.hora = null;
        E.aviso = (r.datos && r.datos.aviso) || 'Ese horario se acaba de ocupar. Elija otro, por favor.';
        pantallaElegir(); window.scrollTo(0, 0);
      }).catch(function (e) { b.disabled = false; b.textContent = 'Confirmar visita'; $('cambiar').hidden = false; alertaSuave(e.message); });
    };
  }
  function alertaSuave(msg) {
    var a = document.createElement('div'); a.className = 'aviso'; a.textContent = msg;
    $('cuerpo').insertBefore(a, $('cuerpo').firstChild); window.scrollTo(0, 0);
  }
  function pantallaListo(resumen, meet) {
    var d = E.datos;
    window.scrollTo(0, 0);
    cuerpo('<div class="resumen"><div class="sello">' + ICO_OK + '</div><p class="ceja">Visita agendada</p><h1>¡Listo' + (d.saludo ? ', ' + esc(d.saludo) : '') + '!</h1>' +
      '<p>Le esperamos el <b>' + esc(resumen) + '</b>' + (/\.$/.test(resumen) ? '' : '.') + '</p></div>' +
      '<div style="margin-top:22px">' + lugarCaja(lugarPorId(E.lugar), meet) + '</div>' +
      '<p class="nota" style="text-align:center">' + (lugarPorId(E.lugar).video ? 'También le mandamos el link de la videollamada por WhatsApp.' : 'También le mandamos la confirmación por WhatsApp.') + '</p>');
    pie('<a class="boton" href="' + WA + '">Volver a WhatsApp</a>');
  }

  if (!token) return error('Este link está incompleto. Pídanos uno nuevo por WhatsApp.');
  api({ t: token, accion: 'inicio' }).then(function (d) { E.datos = d; pantallaElegir(); }).catch(function (e) { error(e.message); });
})();
</script>
